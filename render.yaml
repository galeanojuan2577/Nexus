services:
  - type: web
    name: nexus-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    repo: https://github.com/galeanojuan2577/Nexus
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://nexus-frontend-got9.onrender.com,https://nexus-frontend.onrender.com
      - key: JWT_EXPIRATION_HOURS
        value: "24"
      - key: LOG_LEVEL
        value: INFO
      - key: NEXUS_SCAN_TIMEOUT
        value: "600"

  - type: staticSite
    name: nexus-frontend
    repo: https://github.com/galeanojuan2577/Nexus
    branch: main
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://nexus-backend.onrender.com

databases:
  - name: nexus-db
    plan: free
    databaseName: nexus
    user: nexus
