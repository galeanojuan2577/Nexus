name: NEXUS Deploy

on:
  workflow_run:
    workflows: ["NEXUS CI"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend to Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_BACKEND not set — relying on Render autoDeploy"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"

      - name: Deploy Frontend to Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_FRONTEND not set — relying on Render autoDeploy"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
