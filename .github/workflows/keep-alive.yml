name: Keep Render Alive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          curl -fsS -o /dev/null -w "%{http_code}\n" \
            https://nexus-backend.onrender.com/health || {
              echo "Backend not reachable"
              exit 1
            }
