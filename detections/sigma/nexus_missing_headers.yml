title: NEXUS — Missing Security Headers (HSTS/CSP)
id: 5d8a0e44-nexus-missing-headers-0003
status: experimental
description: >
  Detection content mirroring NEXUS scanner findings for missing
  Strict-Transport-Security or Content-Security-Policy headers.
  HSTS gap maps to MITRE ATT&CK T1557 (Adversary-in-the-Middle).
references:
  - https://attack.mitre.org/techniques/T1557/
author: NEXUS SOC Demo
date: 2026-09-23
tags:
  - attack.initial_access
  - attack.t1557
logsource:
  product: nexus
  service: scanner
detection:
  selection:
    check_type: security_headers
    title:
      - Missing Strict-Transport-Security
      - Missing Content-Security-Policy
  condition: selection
falsepositives:
  - Internal-only services intentionally without public HSTS
level: medium
